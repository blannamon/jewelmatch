# Local Supabase project configuration.
# Keep this file in source control; never put service role keys here.
project_id = "jewelmatch"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Подтвердите адрес электронной почты — JewelMatch"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Сброс пароля — JewelMatch"
content_path = "./supabase/templates/recovery.html"
